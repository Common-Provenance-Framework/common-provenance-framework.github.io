<h2 id="desc" class="list">Provenance of Data Generation Ontology (PDG-O): Description <span class="backlink"> back to <a href="#toc">ToC</a></span></h2>

<p>PDG-O follows the structure of the Provenance of Data Generation (PDG) structures, which are used together
with the Common Provenance Model (CPM). See the <a href="/specification/">CPM specification</a> for further
information on CPM.</p>
