<h2 id="desc" class="list">Provenance of Biological Material Ontology (PBM-O): Description <span class="backlink"> back to <a href="#toc">ToC</a></span></h2>

<p>PBM-O follows the structure of the Provenance of Biological Material (PBM) structures, which are used together
with the Common Provenance Model (CPM). See the <a href="/specification/">CPM specification</a> for further
information on CPM.</p>
